name: HishoCard
options:
  bundleIdPrefix: com.goonobu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ITSAppUsesNonExemptEncryption: false

targets:
  HishoCard:
    type: application
    platform: iOS
    sources:
      - path: HishoCard
    resources:
      - path: HishoCard/Resources/deck
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goonobu.hishocard
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HishoCard/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  HishoCardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HishoCardTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goonobu.hishocard.tests
    dependencies:
      - target: HishoCard

  HishoCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HishoCardUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goonobu.hishocard.uitests
    dependencies:
      - target: HishoCard

schemes:
  HishoCard:
    build:
      targets:
        HishoCard: all
        HishoCardTests: [test]
        HishoCardUITests: [test]
    test:
      targets:
        - HishoCardTests
        - HishoCardUITests
    run:
      config: Debug
